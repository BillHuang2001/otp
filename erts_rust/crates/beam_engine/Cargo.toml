[package]
name = "beam_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed block IR, direct-threaded interpreter and the BeamAsm/Cranelift JIT tiers."

[dependencies]
beam_common = { path = "../beam_common" }
beam_term = { path = "../beam_term" }
beam_alloc = { path = "../beam_alloc" }
beam_loader = { path = "../beam_loader" }
# The arena's Tier-B reclaim (`src/context/reclaim.rs`) drives `beam_gc`'s published
# relocation API (`FromSet`/`LinearDest`/`Relocator`). Directionally legal: `beam_gc` is
# wave 1, `beam_engine` is wave 4, and `beam_gc` does not depend on `beam_engine`.
beam_gc = { path = "../beam_gc" }
libc.workspace = true
cranelift-codegen = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }

[features]
default = []
# Documented alias for the baseline tier: `"baseline-jit"` is part of every build's
# tier roster (see `src/jit/mod.rs`), so this feature adds nothing — it is kept so
# that existing `--features jit-beamasm` invocations keep working.
jit-beamasm = []
jit-cranelift = ["dep:cranelift-codegen", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-frontend"]

[lints]
workspace = true
