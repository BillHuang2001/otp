[package]
name = "beam_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed block IR, direct-threaded interpreter and the BeamAsm/Cranelift JIT tiers."

[dependencies]
beam_common = { path = "../beam_common" }
beam_term = { path = "../beam_term" }
beam_loader = { path = "../beam_loader" }
libc.workspace = true
cranelift-codegen = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }

[features]
default = []
jit-beamasm = []
jit-cranelift = ["dep:cranelift-codegen", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-frontend"]

[lints]
workspace = true
