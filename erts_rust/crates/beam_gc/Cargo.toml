[package]
name = "beam_gc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-process generational semi-space copying GC, MSO sweep and heap sizing."

[dependencies]
beam_common = { path = "../beam_common" }
beam_term = { path = "../beam_term" }
beam_alloc = { path = "../beam_alloc" }
libc.workspace = true

[dev-dependencies]
# `tests/gc_value_oracle.rs` re-encodes a post-collection term with the External Term
# Format codec and compares it byte-for-byte with the system Erlang oracle's
# `term_to_binary/1`. This is a **dev-only** edge (never a real dependency, so the
# release DAG is unchanged): `beam_codec` depends only on `beam_common`/`beam_term`/
# `beam_alloc`/`flate2`/`libc` and does **not** depend on `beam_gc` (directly or
# transitively), so it adds no cycle — neither a dev-only cycle nor a backward wave edge.
beam_codec = { path = "../beam_codec" }

[lints]
workspace = true
