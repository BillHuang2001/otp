[package]
name = "beam_rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust ERTS runtime binary: boot sequence, preloaded modules, CLI flags and system_info."

[lib]
name = "beam_rt"
path = "src/lib.rs"

[[bin]]
name = "beam_rt"
path = "src/main.rs"

[dependencies]
beam_common = { path = "../beam_common" }
beam_term = { path = "../beam_term" }
beam_alloc = { path = "../beam_alloc" }
beam_codec = { path = "../beam_codec" }
beam_dist = { path = "../beam_dist" }
beam_abi = { path = "../beam_abi" }
beam_loader = { path = "../beam_loader" }
beam_engine = { path = "../beam_engine" }
beam_gc = { path = "../beam_gc" }
beam_message = { path = "../beam_message" }
beam_process = { path = "../beam_process" }
beam_bifs = { path = "../beam_bifs" }
beam_ets = { path = "../beam_ets" }
beam_io = { path = "../beam_io" }
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# The optional Cranelift hot tier (default OFF): `BEAM_RT_TIER=cranelift`.
# A pure re-export of `beam_engine`'s `jit-cranelift` feature, so the "is the backend compiled
# in?" gate has exactly one definition and lives where the backend does. Enabling it is the ONLY
# way to reach `Tier::Cranelift`; with it off that selection is a typed `unsupported` capability
# gap (exit code 3), never a silent downgrade to another tier.
cranelift = ["beam_engine/jit-cranelift"]

[lints]
workspace = true
