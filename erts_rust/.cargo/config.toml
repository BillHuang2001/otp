# Cargo build configuration for the Rust ERTS rewrite.
#
# Goal: maximize DEVELOPER ITERATION SPEED (see objective) without compromising release quality.
#  - `mold` is the fastest Linux linker; it dominates incremental link time for a workspace this size.
#  - `lld` is the portable fallback if mold is unavailable.
#  - RUSTFLAGS are intentionally minimal so per-crate overrides stay possible.

[build]
# Uncomment to default to the JIT-enabled runtime binary while iterating.
# default-members = ["crates/beam_rt"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Portable fallback on hosts without mold: use `--config` to override, or switch the linker here.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Convenience aliases for the common iteration loop.
t = "test --workspace"
tb = "test --workspace --no-fail-fast"
b = "build --workspace"
fmt = "fmt --all"
