# Cargo build configuration for the Rust ERTS rewrite.
#
# Goal: maximize DEVELOPER ITERATION SPEED (see objective) without compromising release quality.
# Link time dominates incremental builds for a workspace this size, so we route linking through a
# fast linker. The `Nix` devShell (../flake.nix) provides `mold` + `clang` and overrides the env
# vars below; in a bare container we fall back to the always-present `cc` driver with `lld`.
#
# Precedence note: `CARGO_TARGET_<triple>_LINKER` / `..._RUSTFLAGS` env vars (set by the devShell)
# take precedence over these config values.

[build]
# Keep incremental + debug info settings in the workspace profile (see ../Cargo.toml).

[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "cc"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[alias]
# Convenience aliases for the common iteration loop.
t = "test --workspace"
tb = "test --workspace --no-fail-fast"
b = "build --workspace"
fmt = "fmt --all"
