# Rust ERTS rewrite — Cargo workspace.
#
# Decomposed along the BEAM subsystem seams (Part II §A/§H). Every member is a routing node in the
# Context Tree; see ./CONTEXT.md for contracts and the routing table.
[workspace]
resolver = "2"
members = [
    # --- Foundation (Stage 0) ---
    "crates/beam_common",
    "crates/beam_term",
    "crates/beam_alloc",
    "crates/beam_codec",
    "crates/beam_dist",
    "crates/beam_abi",
    # --- Execution engine (Stage 1) ---
    "crates/beam_loader",
    "crates/beam_engine",
    # --- Runtime core (Stages 3–5) ---
    "crates/beam_gc",
    "crates/beam_process",
    "crates/beam_message",
    "crates/beam_bifs",
    "crates/beam_ets",
    "crates/beam_io",
    # --- Top-level binary ---
    "crates/beam_rt",
    # --- Tooling ---
    "tools/differential",
    "tools/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/erlang/otp"
authors = ["Erlang/OTP Rust rewrite"]

[workspace.lints.rust]
# Shared lint baseline for every workspace member (opt in via `[lints] workspace = true`).
unsafe_op_in_unsafe_fn = "warn"

[workspace.dependencies]
# Intra-workspace crates (path deps are declared per-crate; these alias common ones).
beam_common = { path = "crates/beam_common" }
beam_term = { path = "crates/beam_term" }
beam_alloc = { path = "crates/beam_alloc" }
beam_codec = { path = "crates/beam_codec" }
beam_dist = { path = "crates/beam_dist" }
beam_abi = { path = "crates/beam_abi" }
beam_loader = { path = "crates/beam_loader" }
beam_engine = { path = "crates/beam_engine" }
beam_gc = { path = "crates/beam_gc" }
beam_process = { path = "crates/beam_process" }
beam_message = { path = "crates/beam_message" }
beam_bifs = { path = "crates/beam_bifs" }
beam_ets = { path = "crates/beam_ets" }
beam_io = { path = "crates/beam_io" }
beam_rt = { path = "crates/beam_rt" }

# External (Apache-2.0 / MIT preferred; see Part I §G.6 licensing).
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext"] }
cranelift-codegen = { version = "0.116", default-features = false, features = ["x86", "arm64", "std"] }
cranelift-module = "0.116"
cranelift-jit = "0.116"
cranelift-frontend = "0.116"
bitflags = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
parking_lot = "0.12"
crossbeam-epoch = "0.9"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Fast iteration: light optimization, cheap debug info.
opt-level = 1
debug = 1
incremental = true

# Optimize dependencies even in dev builds (big win for e.g. cranelift in tests).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
